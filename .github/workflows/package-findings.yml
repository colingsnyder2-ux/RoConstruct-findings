name: Package findings ZIP
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package sources and portable agent evidence
        run: |
          mkdir -p dist
          (cd src && zip -qr ../dist/roconstruct-findings-src.zip .)
          sha256sum dist/roconstruct-findings-src.zip > dist/roconstruct-findings-src.zip.sha256
          evidence=$(ls -d agent-memory reports 2>/dev/null || true)
          if [ -n "$evidence" ]; then
            zip -qr dist/roconstruct-evidence.zip $evidence
            sha256sum dist/roconstruct-evidence.zip > dist/roconstruct-evidence.zip.sha256
          fi
      - name: Update stable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view findings-latest >/dev/null 2>&1 || \
            gh release create findings-latest --title "Latest findings" \
              --notes "Recovered sources and portable agent evidence. Updated on main push." --prerelease
          gh release upload findings-latest dist/* --clobber
